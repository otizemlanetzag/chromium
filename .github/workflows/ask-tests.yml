name: ASK reference tests

on:
  pull_request:
    paths:
      - "ask/**"
      - ".github/workflows/ask-tests.yml"
  push:
    branches: [main, ask-language-foundation]
    paths:
      - "ask/**"
      - ".github/workflows/ask-tests.yml"

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ask/
            .github/workflows/ask-tests.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check extension JavaScript syntax
        run: node --check ask/hosts/chromium_extension/popup.js && node --check ask/hosts/chromium_extension/content.js && node --check ask/hosts/chromium_extension/service_worker.js
      - name: Run ASK smoke tests
        run: python -m unittest discover -s ask/tests -v
      - name: Package Chromium extension
        run: cd ask/hosts && zip -r "$GITHUB_WORKSPACE/ask-chromium-extension.zip" chromium_extension
      - uses: actions/upload-artifact@v4
        with:
          name: ask-chromium-extension
          path: ask-chromium-extension.zip
          retention-days: 14
