<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASK</title>
  <style>
    :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
    body { width: 340px; margin: 0; padding: 16px; box-sizing: border-box; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { color: GrayText; margin: 0 0 14px; }
    label { display: block; margin: 10px 0 5px; font-weight: 600; }
    input, select, button { box-sizing: border-box; width: 100%; padding: 8px; font: inherit; }
    button { margin-top: 12px; cursor: pointer; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; padding: 10px; border: 1px solid GrayText; border-radius: 6px; }
    #status { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>ASK</h1>
  <p>Chromium active-page host prototype</p>
  <label for="elementId">Element ID</label>
  <input id="elementId" placeholder="submit-button" autocomplete="off">
  <label for="returnType">return.type</label>
  <select id="returnType">
    <option value="clr">clr — computed background color</option>
    <option value="all">all — element markup</option>
    <option value="type">type — element tag</option>
    <option value="text">text — element text</option>
    <option value="id">id — element ID</option>
    <option value="complete">complete — document HTML</option>
  </select>
  <button id="inspect">Run inspection</button>
  <div id="status" role="status" aria-live="polite"></div>
  <pre id="result">Result will appear here.</pre>
  <script src="popup.js"></script>
</body>
</html>
