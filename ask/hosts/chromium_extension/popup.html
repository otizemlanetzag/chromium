<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASK runner</title>
<style>
:root{color-scheme:light dark;font:13px system-ui,sans-serif}
body{width:430px;margin:0;padding:14px;box-sizing:border-box}
h1{font-size:20px;margin:0 0 4px}p{color:GrayText;margin:0 0 10px}
textarea{box-sizing:border-box;width:100%;min-height:220px;resize:vertical;font:12px ui-monospace,monospace;padding:9px}
button{padding:8px 12px;font:inherit;cursor:pointer}
#run{width:100%;margin:9px 0}
#status{margin:5px 0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto;padding:9px;border:1px solid GrayText;border-radius:5px}
.small{font-size:11px}
</style>
</head>
<body>
<h1>ASK</h1>
<p>Run ASK against the active Chromium tab</p>
<textarea id="source" spellcheck="false">check.connect(@chromium)
check.type={device}
html=[active].html
el={submit-button}
return.type=clr
return</textarea>
<button id="run">Run ASK</button>
<div id="status" role="status" aria-live="polite">Ready</div>
<pre id="result">Output will appear here.</pre>
<p class="small">Initial browser runner: active-page DOM inspection, device details, basic API requests, permissions parsing, and dialog choices. Some commands still need native host integration.</p>
<script src="popup.js"></script>
</body>
</html>
